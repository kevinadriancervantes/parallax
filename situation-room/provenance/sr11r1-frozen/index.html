<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Parallax — instrumenting strategic judgment without an answer key.">
  <title>Parallax — Situation Room submission candidate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">P</div>
        <div><div class="eyebrow">PARALLAX / SR-11 PRIVATE CANDIDATE</div><h1>Situation Room</h1></div>
      </div>
      <div class="status"><span class="dot"></span><span>PRIVATE STATIC DERIVATIVE</span><span id="build-id">loading…</span></div>
    </header>
    <nav class="nav" aria-label="Contest candidate views">
      <button class="nav-item active" data-view="overview">Overview</button>
      <button class="nav-item" data-view="vela">Vela</button>
      <button class="nav-item" data-view="afghanistan">Afghanistan 1979</button>
      <button class="nav-item" data-view="profiles">Model profiles</button>
      <button class="nav-item" data-view="observability">Observability</button>
      <button class="nav-item" data-view="nuisance">Nuisance sensitivity</button>
      <button class="nav-item" data-view="known-policy">Known-policy self-test</button>
      <button class="nav-item" data-view="shortcuts">Shortcut diagnostics</button>
      <button class="nav-item" data-view="provenance">Provenance</button>
      <button class="nav-item" data-view="limitations">Limitations</button>
    </nav>
    <main id="view" class="view" aria-live="polite"><div class="loading">Loading sealed projection…</div></main>
    <footer class="footer"><span>Parallax measures observable assessment, not strategic truth.</span><span>Private candidate · no publication or submission authority</span></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
